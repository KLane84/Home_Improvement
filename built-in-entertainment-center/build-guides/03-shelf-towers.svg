<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640">
  <style>
    .t { font: 700 14px sans-serif; fill: #111; }
    .s { font: 11px sans-serif; fill: #444; }
    .d { font: 10px sans-serif; fill: #c45a11; }
    .lbl { font: 10px sans-serif; fill: #333; }
    .ply { fill: #e6d5b8; stroke: #6b542e; stroke-width: 1.1; }
    .assy { fill: #eef3f7; stroke: #222; stroke-width: 1.2; }
    .sheet { fill: #f5f0e6; stroke: #888; stroke-width: 1; stroke-dasharray: 4 3; }
  </style>

  <text x="16" y="24" class="t">03  Shelf towers + shelves from ¾3 plywood</text>
  <text x="16" y="42" class="s">Outer 273 × 123 · sides between-fit shelves 25½3 × 123 · height H field-measured (placeholder 58¼3)</text>

  <!-- Exploded one tower -->
  <g transform="translate(20, 60)">
    <text x="0" y="0" class="t" font-size="12">Parts  ONE tower</text>

    <!-- Side -->
    <rect class="ply" x="0" y="20" width="36" height="175"/>
    <text x="18" y="12" text-anchor="middle" class="d">T1 side</text>
    <text x="18" y="110" text-anchor="middle" class="lbl" transform="rotate(-90 18 110)">123 × H (58¼3)</text>
    <text x="18" y="210" text-anchor="middle" class="s">×2</text>

    <!-- Horizontals stack -->
    <g transform="translate(80, 20)">
      <text x="0" y="-8" class="d">T2T4 horizontals  25½3 × 123 × ¾3</text>
      <rect class="ply" x="0" y="0" width="153" height="36"/>
      <text x="76" y="22" text-anchor="middle" class="lbl">top</text>
      <rect class="ply" x="0" y="44" width="153" height="36"/>
      <text x="76" y="66" text-anchor="middle" class="lbl">shelf</text>
      <rect class="ply" x="0" y="88" width="153" height="36"/>
      <text x="76" y="110" text-anchor="middle" class="lbl">shelf</text>
      <rect class="ply" x="0" y="132" width="153" height="36"/>
      <text x="76" y="154" text-anchor="middle" class="lbl">shelf</text>
      <rect class="ply" x="0" y="176" width="153" height="36"/>
      <text x="76" y="198" text-anchor="middle" class="lbl">shelf</text>
      <rect class="ply" x="0" y="220" width="153" height="36"/>
      <text x="76" y="242" text-anchor="middle" class="lbl">bottom</text>
      <text x="0" y="275" class="s">Qty per tower: 1 top + 1 bottom + 4 shelves = 6 × (25½3 × 123)</text>
    </g>
  </g>

  <!-- Assembled elevation -->
  <g transform="translate(420, 60)">
    <text x="0" y="0" class="t" font-size="12">Assembled (front)</text>
    <rect class="assy" x="20" y="20" width="81" height="175"/>
    <line x1="24" y1="50" x2="97" y2="50" stroke="#666"/>
    <line x1="24" y1="80" x2="97" y2="80" stroke="#666"/>
    <line x1="24" y1="110" x2="97" y2="110" stroke="#666"/>
    <line x1="24" y1="140" x2="97" y2="140" stroke="#666"/>
    <text x="60" y="210" text-anchor="middle" class="d">273 wide</text>
    <text x="110" y="100" class="d">H H 58¼3</text>
    <text x="110" y="116" class="s">to crown</text>
    <text x="20" y="230" class="s">Sits on ¾3 side counter</text>
  </g>

  <!-- Both towers buy list -->
  <g transform="translate(20, 360)">
    <text x="0" y="0" class="t" font-size="12">Both towers  cut list</text>
    <text x="0" y="22" class="s">4 × (123 × 58¼3 × ¾3) sides</text>
    <text x="0" y="40" class="s">12 × (25½3 × 123 × ¾3) tops / bottoms / shelves</text>
    <text x="0" y="62" class="d">Sheet goods: ~2 × 4×8 of ¾3 plywood (sides on one sheet, horizontals on another)</text>
    <text x="0" y="80" class="s">Recalculate H after measuring floor ’ underside of crown at each tower.</text>
  </g>

  <!-- Nest sketch -->
  <g transform="translate(380, 360)">
    <text x="0" y="0" class="t" font-size="12">Sheet A  sides</text>
    <rect class="sheet" x="0" y="10" width="192" height="96"/>
    <rect class="ply" x="4" y="14" width="24" height="70"/>
    <rect class="ply" x="32" y="14" width="24" height="70"/>
    <rect class="ply" x="60" y="14" width="24" height="70"/>
    <rect class="ply" x="88" y="14" width="24" height="70"/>
    <text x="0" y="120" class="s">4 strips @ 123 × 58¼3</text>
  </g>
</svg>
