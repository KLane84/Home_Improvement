<!--
  Path A — build guide (true scale)
  Scale: 1 inch = 3.5 px (same X and Y). SVG viewBox preserves aspect ratio when scaled to fit the window.
  Decided: open outer flanks (~20?"); tight 119" carcass group; face skin (no 6" fillers).
  Stack (synced to build-guides/00-lumber-standards.md):
    riser 3½" (2×4 on edge) + cabinet 30" + counter ¾" = 34¼" side top AFF
    step vs center ~4¼"; tower H placeholder ?58¼" (crown underside 92½" assumed)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c45a11"/>
    </marker>
    <marker id="arrowStart" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#c45a11"/>
    </marker>
  </defs>
  <style>
    .t { font: 700 15px sans-serif; fill: #111; }
    .s { font: 11px sans-serif; fill: #444; }
    .d { font: 10px sans-serif; fill: #555; }
    .dh { font: 700 10px sans-serif; fill: #c45a11; }
    .wall { fill: #ececec; stroke: #222; stroke-width: 1; }
    .open { fill: #f7f7f7; stroke: #999; stroke-width: 1; stroke-dasharray: 5 4; }
    .side { fill: #dce6f0; stroke: #222; stroke-width: 1.2; }
    .ctr { fill: #cfd8e0; stroke: #222; stroke-width: 1.2; }
    .riser { fill: #b8b8b8; stroke: #222; stroke-width: 1; }
    .cntS { fill: #2a6bb5; stroke: #1a5080; stroke-width: 0.7; }
    .cntC { fill: #5a82a8; stroke: #1a5080; stroke-width: 0.7; }
    .tower { fill: #f4f7fa; stroke: #222; stroke-width: 1.1; }
    .bead { fill: #f2f0ea; stroke: #777; stroke-width: 0.6; }
    .tv { fill: #222; }
    .floor { stroke: #222; stroke-width: 1.6; }
    .dimL { stroke: #c45a11; stroke-width: 1; fill: none; marker-start: url(#arrowStart); marker-end: url(#arrow); }
    .tick { stroke: #c45a11; stroke-width: 1; }
  </style>

  <!-- Scale note -->
  <text x="16" y="22" class="t">Path A — build guide (decided)</text>
  <text x="16" y="40" class="s">True scale: 1? = 3.5 px on both axes · synced to lumber standards (3½? riser, ¾? counter)</text>
  <text x="16" y="56" class="s">Open flanks ~20?? · 119? carcass group centered · face skin / scribe · stepped counters · towers to crown</text>

  <!-- Elevation: S=3.5; wallW=159.25*3.5=557.375; ceil=96*3.5=336; floorY local=336
       flank=20.125*3.5=70.4375; cab=27*3.5=94.5; center=65*3.5=227.5
       riser=3.5*3.5=12.25; counter=0.75*3.5=2.625; sideTopAFF=34.25 ? y=336-119.875=216.125
       crown underside ~92.5" ? y=336-323.75=12.25; tower H=58.25" ? 203.875 px
  -->
  <g id="elevation" transform="translate(50, 70)">
    <!-- Wall -->
    <rect class="wall" x="0" y="0" width="557.4" height="336"/>
    <!-- Open flanks -->
    <rect class="open" x="0" y="0" width="70.4" height="336"/>
    <rect class="open" x="487" y="0" width="70.4" height="336"/>

    <!-- Crown / ceiling underside line (assumed 3½? crown ? underside ~92½? AFF) -->
    <line x1="70.4" y1="12.3" x2="487" y2="12.3" stroke="#222" stroke-width="1.5"/>
    <text x="200" y="8" class="d">crown underside (assumed 92½? AFF until measured)</text>

    <!-- Beadboard between towers, above center (from crown underside to ~center top) -->
    <rect class="bead" x="164.9" y="12.3" width="227.5" height="218.7"/>
    <text x="250" y="100" class="d">beadboard (upper center bay only)</text>

    <!-- TV: ~48x28, bottom ~48" AFF; top at 76"; y_top=336-76*3.5=70; h=28*3.5=98 -->
    <rect class="tv" x="238" y="70" width="84" height="98" rx="2"/>
    <text x="280" y="124" text-anchor="middle" fill="#ccc" font-size="11">TV</text>

    <!-- Left tower: crown underside (y=12.3) to side counter top (y=216.1) -->
    <rect class="tower" x="70.4" y="12.3" width="94.5" height="203.8"/>
    <line x1="74" y1="48" x2="161" y2="48" stroke="#888" stroke-width="0.6"/>
    <line x1="74" y1="84" x2="161" y2="84" stroke="#888" stroke-width="0.6"/>
    <line x1="74" y1="120" x2="161" y2="120" stroke="#888" stroke-width="0.6"/>
    <line x1="74" y1="156" x2="161" y2="156" stroke="#888" stroke-width="0.6"/>
    <line x1="74" y1="192" x2="161" y2="192" stroke="#888" stroke-width="0.6"/>

    <!-- Right tower -->
    <rect class="tower" x="392.4" y="12.3" width="94.5" height="203.8"/>
    <line x1="396" y1="48" x2="483" y2="48" stroke="#888" stroke-width="0.6"/>
    <line x1="396" y1="84" x2="483" y2="84" stroke="#888" stroke-width="0.6"/>
    <line x1="396" y1="120" x2="483" y2="120" stroke="#888" stroke-width="0.6"/>
    <line x1="396" y1="156" x2="483" y2="156" stroke="#888" stroke-width="0.6"/>
    <line x1="396" y1="192" x2="483" y2="192" stroke="#888" stroke-width="0.6"/>

    <!-- Floor -->
    <line class="floor" x1="0" y1="336" x2="557.4" y2="336"/>

    <!-- LEFT stack: riser 3½" (h=12.25), carcass 30" (h=105), counter ¾" (h=2.625) -->
    <rect class="riser" x="70.4" y="323.8" width="94.5" height="12.2"/>
    <rect class="side" x="70.4" y="218.8" width="94.5" height="105"/>
    <rect class="cntS" x="68.4" y="216.1" width="98.5" height="2.7"/>

    <!-- CENTER: no riser; carcass 30" from floor (y=231); existing top (thin, not a ¾? blank) -->
    <rect class="ctr" x="164.9" y="231" width="227.5" height="105"/>
    <rect class="cntC" x="164.9" y="229.5" width="227.5" height="1.5"/>

    <!-- RIGHT stack -->
    <rect class="riser" x="392.4" y="323.8" width="94.5" height="12.2"/>
    <rect class="side" x="392.4" y="218.8" width="94.5" height="105"/>
    <rect class="cntS" x="390.4" y="216.1" width="98.5" height="2.7"/>

    <!-- Scribe joints (hairline, not gaps) -->
    <line x1="164.9" y1="218.8" x2="164.9" y2="336" stroke="#888" stroke-width="0.8" stroke-dasharray="3 2"/>
    <line x1="392.4" y1="218.8" x2="392.4" y2="336" stroke="#888" stroke-width="0.8" stroke-dasharray="3 2"/>

    <!-- Outer returns -->
    <line x1="70.4" y1="216.1" x2="70.4" y2="336" stroke="#222" stroke-width="2"/>
    <line x1="486.9" y1="216.1" x2="486.9" y2="336" stroke="#222" stroke-width="2"/>

    <!-- ========== WIDTH DIMENSIONS (below floor) ========== -->
    <line class="dimL" x1="0" y1="352" x2="70.4" y2="352"/>
    <text x="35" y="366" text-anchor="middle" class="dh">20??</text>
    <text x="35" y="378" text-anchor="middle" class="d">open flank</text>

    <line class="dimL" x1="70.4" y1="352" x2="164.9" y2="352"/>
    <text x="117.5" y="366" text-anchor="middle" class="dh">27?</text>
    <text x="117.5" y="378" text-anchor="middle" class="d">side cab</text>

    <line class="dimL" x1="164.9" y1="352" x2="392.4" y2="352"/>
    <text x="278.5" y="366" text-anchor="middle" class="dh">65?</text>
    <text x="278.5" y="378" text-anchor="middle" class="d">center</text>

    <line class="dimL" x1="392.4" y1="352" x2="486.9" y2="352"/>
    <text x="439.5" y="366" text-anchor="middle" class="dh">27?</text>
    <text x="439.5" y="378" text-anchor="middle" class="d">side cab</text>

    <line class="dimL" x1="486.9" y1="352" x2="557.4" y2="352"/>
    <text x="522" y="366" text-anchor="middle" class="dh">20??</text>
    <text x="522" y="378" text-anchor="middle" class="d">open flank</text>

    <!-- Overall wall -->
    <line class="dimL" x1="0" y1="392" x2="557.4" y2="392"/>
    <text x="278" y="408" text-anchor="middle" class="dh">wall 159¼? · carcass group 119? (27+65+27) centered</text>

    <!-- ========== HEIGHT DIMENSIONS (left of drawing) ========== -->
    <line class="dimL" x1="-28" y1="0" x2="-28" y2="336"/>
    <text x="-40" y="170" class="dh" transform="rotate(-90 -40 170)">96? ceiling (assumed)</text>

    <!-- Side stack: riser + carcass + counter -->
    <line class="tick" x1="-8" y1="336" x2="-2" y2="336"/>
    <line class="tick" x1="-8" y1="323.8" x2="-2" y2="323.8"/>
    <line class="tick" x1="-8" y1="218.8" x2="-2" y2="218.8"/>
    <line class="tick" x1="-8" y1="216.1" x2="-2" y2="216.1"/>
    <line class="dimL" x1="-5" y1="336" x2="-5" y2="323.8"/>
    <text x="-18" y="333" class="dh" transform="rotate(-90 -18 333)">3½?</text>
    <line class="dimL" x1="-5" y1="323.8" x2="-5" y2="218.8"/>
    <text x="-18" y="275" class="dh" transform="rotate(-90 -18 275)">30?</text>
    <line class="dimL" x1="-5" y1="218.8" x2="-5" y2="216.1"/>
    <text x="-18" y="221" class="dh" transform="rotate(-90 -18 221)">¾?</text>

    <!-- Side total to counter top -->
    <line class="dimL" x1="-48" y1="336" x2="-48" y2="216.1"/>
    <text x="-60" y="285" class="dh" transform="rotate(-90 -60 285)">34¼? side top</text>

    <!-- Center height -->
    <line class="dimL" x1="570" y1="336" x2="570" y2="229.5"/>
    <text x="582" y="290" class="dh">~30?</text>
    <text x="582" y="302" class="d">center (no riser)</text>

    <!-- Step callout -->
    <line class="dimL" x1="155" y1="229.5" x2="155" y2="216.1"/>
    <text x="118" y="225" class="dh">~4¼? step</text>

    <!-- Tower height label -->
    <line class="dimL" x1="55" y1="12.3" x2="55" y2="216.1"/>
    <text x="42" y="120" class="dh" transform="rotate(-90 42 120)">tower ~58¼? (field-measure)</text>

    <!-- Depth note on open flank -->
    <text x="8" y="200" class="d" transform="rotate(-90 8 200)">open wall</text>
  </g>

  <!-- Height stack callout box -->
  <g transform="translate(50, 500)">
    <rect x="0" y="0" width="560" height="100" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
    <text x="12" y="20" class="t" font-size="13">Side stack (lumber-synced)</text>
    <text x="12" y="40" class="s">3½? riser (2×4 on edge — actual 1½? × 3½?) + 30? cabinet + ¾? plywood counter = 34¼? to side counter top</text>
    <text x="12" y="58" class="s">Center stays ~30? (no riser) ? ~4¼? visible step. Towers: crown underside ? 34¼? (placeholder ~58¼? at 96? FFE / ~3½? crown).</text>
    <text x="12" y="76" class="s">Do not cut tower sides until L/C/R ceiling is measured. Optional riser top decks add ¾? — skip them to keep this stack.</text>
    <text x="12" y="92" class="d">Legacy 4? / 1½? counter / 14?? flank sketches are superseded. Source of truth: build-guides/00-lumber-standards.md</text>
  </g>
</svg>
